pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx eslint {staged_files} --fix
      stage_fixed: true
    prettier:
      glob: "*.{ts,js,json,yaml,yml,md}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    rustfmt:
      glob: "*.rs"
      run: cargo fmt -- {staged_files}
    ruff:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    secrets:
      run: npx secretlint {staged_files}
      skip_on_missing: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
