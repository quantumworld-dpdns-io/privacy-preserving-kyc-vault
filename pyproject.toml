[project]
name = "kyc-vault-ai"
version = "0.1.0"
description = "AI/ML components for Privacy-Preserving KYC Vault"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "torch>=2.5",
    "transformers>=4.47",
    "sentence-transformers>=3.3",
    "flwr>=1.14",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "black>=24.10",
    "ipython>=8.30",
]
fl = ["flwr>=1.14", "nvidia-flare>=4.5"]
quantum = ["qiskit>=1.4", "cuda-quantum>=0.9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
