version: '3.8'

services:
  # Infrastructure services
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kyc_vault
      POSTGRES_USER: kyc
      POSTGRES_PASSWORD: kyc
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  weaviate:
    image: semitechnologies/weaviate:1.28
    ports:
      - "8080:8080"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: text2vec-transformers
      ENABLE_MODULES: text2vec-transformers
      TRANSFORMERS_INFERENCE_API: http://t2v-transformers:8080
    volumes:
      - weaviatedata:/var/lib/weaviate
    depends_on:
      - t2v-transformers

  t2v-transformers:
    image: semitechnologies/transformers-inference:sentence-transformers-all-MiniLM-L6-v2
    ports:
      - "8081:8080"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # API Gateway (NGINX with PQC support)
  api-gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - did-service
      - credential-service
      - kyc-service
      - zkp-service
      - billing-service
      - webhook-service
      - admin-service
    volumes:
      - ./services/gateway/nginx/conf.d:/etc/nginx/conf.d
      - ./services/gateway/nginx/ssl:/etc/nginx/ssl
      - ./services/gateway/nginx/html:/usr/share/nginx/html

  # Microservices
  did-service:
    build:
      context: ./services/did
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./services/did/src:/app/src
      - ./services/did/package.json:/app/package.json
      - ./services/did/tsconfig.json:/app/tsconfig.json

  credential-service:
    build:
      context: ./services/credential
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGODB_URI=mongodb://mongo:27017/kyc_vault
    depends_on:
      - redis
      - mongo
    volumes:
      - ./services/credential/src:/app/src
      - ./services/credential/package.json:/app/package.json
      - ./services/credential/tsconfig.json:/app/tsconfig.json

  kyc-service:
    build:
      context: ./services/kyc
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3003
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGODB_URI=mongodb://mongo:27017/kyc_vault
    depends_on:
      - redis
      - mongo
    volumes:
      - ./services/kyc/src:/app/src
      - ./services/kyc/package.json:/app/package.json
      - ./services/kyc/tsconfig.json:/app/tsconfig.json

  zkp-service:
    build:
      context: ./services/zkp
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3004
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./services/zkp/src:/app/src
      - ./services/zkp/package.json:/app/package.json
      - ./services/zkp/tsconfig.json:/app/tsconfig.json

  billing-service:
    build:
      context: ./services/billing
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3005
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGODB_URI=mongodb://mongo:27017/kyc_vault
      - STRIPE_API_KEY=${STRIPE_API_KEY}
    depends_on:
      - redis
      - mongo
    volumes:
      - ./services/billing/src:/app/src
      - ./services/billing/package.json:/app/package.json
      - ./services/billing/tsconfig.json:/app/tsconfig.json

  webhook-service:
    build:
      context: ./services/webhook
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3006
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./services/webhook/src:/app/src
      - ./services/webhook/package.json:/app/package.json
      - ./services/webhook/tsconfig.json:/app/tsconfig.json

  admin-service:
    build:
      context: ./services/admin
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3007
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./services/admin/src:/app/src
      - ./services/admin/package.json:/app/package.json
      - ./services/admin/tsconfig.json:/app/tsconfig.json

  # Additional databases
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: kyc
      MONGO_INITDB_ROOT_PASSWORD: kyc
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
  weaviatedata:
  ollamadata:
  mongodata:
