name: Question
description: Ask a question about the project
title: "[Question] "
labels: [question, triage]
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Have a question? Check our [documentation](https://docs.example.com) and [FAQ](https://docs.example.com/faq) first.

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      description: What area is your question about?
      options:
        - usage / how-to
        - configuration
        - deployment
        - API / integration
        - development / contributing
        - security
        - performance
        - architecture
        - licensing
        - other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
      placeholder: "How do I...?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to accomplish?
      placeholder: I'm trying to...

  - type: input
    id: environment
    attributes:
      label: Environment (if applicable)
      description: Version, OS, browser, etc.
      placeholder: "v1.2.3, macOS 14, Chrome 120"

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I have searched existing issues and documentation before asking
          required: true
