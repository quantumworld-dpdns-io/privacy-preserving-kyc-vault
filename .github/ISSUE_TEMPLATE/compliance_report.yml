name: Compliance Report
description: Report a compliance or regulatory concern
title: "[Compliance] "
labels: [compliance, triage]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report compliance or regulatory concerns related to:
        - GDPR / CCPA / CPRA
        - SOC 2 / SOC 3
        - HIPAA / HITECH
        - PCI DSS
        - FedRAMP / StateRAMP
        - ISO 27001 / 27701
        - Internal security policies
        - Data retention policies

  - type: dropdown
    id: framework
    attributes:
      label: Regulatory Framework
      description: Which framework is this related to?
      multiple: true
      options:
        - GDPR
        - CCPA/CPRA
        - SOC 2
        - HIPAA
        - PCI DSS
        - ISO 27001
        - FedRAMP
        - Internal Policy
        - Data Retention
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Compliance Severity
      description: Risk level
      options:
        - critical (regulatory violation, potential fine)
        - high (non-compliance with clear requirements)
        - medium (deviation from best practice)
        - low (documentation gap, minor issue)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Compliance Concern
      description: Describe the compliance issue
      placeholder: What requirement is not being met?
    validations:
      required: true

  - type: textarea
    id: requirement
    attributes:
      label: Relevant Requirement
      description: Quote or reference the specific requirement
      placeholder: Article, section, or policy reference
    validations:
      required: true

  - type: textarea
    id: current_state
    attributes:
      label: Current State
      description: What is currently implemented?
    validations:
      required: true

  - type: textarea
    id: gap
    attributes:
      label: Compliance Gap
      description: Describe the gap between current state and requirements
    validations:
      required: true

  - type: textarea
    id: remediation
    attributes:
      label: Suggested Remediation
      description: How can we address this compliance gap?

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I have verified this is a genuine compliance concern
          required: true
        - label: I have checked existing compliance reports for duplicates
          required: true
