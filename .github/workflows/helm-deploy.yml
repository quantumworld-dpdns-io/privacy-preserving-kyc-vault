name: Deploy Helm Chart

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "helmfile.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      release_name:
        description: "Helm release name"
        required: true
        type: string
      chart_path:
        description: "Path to chart"
        required: true
        type: string
      values_file:
        description: "Values file"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  HELM_VERSION: 3.16.0
  KUBECTL_VERSION: v1.31.0

jobs:
  lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint chart
        run: |
          helm lint ${{ github.event.inputs.chart_path || './charts/app' }} \
            -f ${{ github.event.inputs.values_file || '' }}

      - name: Template chart
        run: |
          helm template test-release ${{ github.event.inputs.chart_path || './charts/app' }} \
            -f ${{ github.event.inputs.values_file || '' }} > /dev/null

  deploy:
    name: Deploy Helm Chart (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    needs: lint
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          KUBE_CONFIG_SECRET="KUBE_CONFIG_${{ github.event.inputs.environment || 'STAGING' }}"
          echo "${!KUBE_CONFIG_SECRET}" > $HOME/.kube/config

      - name: Configure AWS credentials
        if: vars.USE_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR (Helm OCI)
        if: vars.USE_ECR == 'true'
        run: |
          aws ecr get-login-password | helm registry login \
            ${{ vars.ECR_REGISTRY }} --username AWS --password-stdin

      - name: Helm Dependency Update
        run: |
          helm dependency update ${{ github.event.inputs.chart_path || './charts/app' }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install \
            ${{ github.event.inputs.release_name || 'my-app' }} \
            ${{ github.event.inputs.chart_path || './charts/app' }} \
            -f ${{ github.event.inputs.values_file || format('charts/app/values-{0}.yaml', github.event.inputs.environment || 'staging') }} \
            --namespace ${{ github.event.inputs.environment || 'staging' }} \
            --create-namespace \
            --atomic \
            --timeout 10m \
            --wait

      - name: Verify release
        run: |
          helm status ${{ github.event.inputs.release_name || 'my-app' }} \
            -n ${{ github.event.inputs.environment || 'staging' }}
          kubectl get pods -n ${{ github.event.inputs.environment || 'staging' }} \
            -l app.kubernetes.io/instance=${{ github.event.inputs.release_name || 'my-app' }}

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."
          helm rollback ${{ github.event.inputs.release_name || 'my-app' }} \
            -n ${{ github.event.inputs.environment || 'staging' }} \
            --wait --timeout 5m
