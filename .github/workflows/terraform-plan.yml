name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - "**.tf"
      - "**.tfvars"
  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform workspace"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  pull-requests: write

env:
  TF_DIR: terraform
  TF_VERSION: 1.9.0

jobs:
  terraform-plan:
    name: Terraform Plan (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config=backends/${{ github.event.inputs.environment || 'staging' }}.backend.hcl \
            -reconfigure

      - name: Terraform Workspace
        run: |
          terraform workspace select ${{ github.event.inputs.environment || 'staging' }} || \
          terraform workspace new ${{ github.event.inputs.environment || 'staging' }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -no-color
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=env/${{ github.event.inputs.environment || 'staging' }}.tfvars \
            -no-color \
            -out=tfplan \
            -detailed-exitcode
        continue-on-error: true

      - name: Format plan output
        id: plan-output
        run: |
          PLAN_OUTPUT=$(terraform show -no-color tfplan 2>/dev/null || echo "Plan output not available")
          echo "PLAN_OUTPUT<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment PR with plan
        uses: actions/github-script@v7
        with:
          script: |
            const planOutput = `${{ steps.plan-output.outputs.PLAN_OUTPUT }}`;
            const planExitCode = ${{ steps.plan.outcome == 'success' && '0' || '1' }};
            const body = `## Terraform Plan (\`${{ github.event.inputs.environment || 'staging' }}\`)
            
            **Status**: ${planExitCode === 0 ? ':white_check_mark:' : ':x:'}
            
            <details>
            <summary>View Plan</summary>
            
            \`\`\`hcl
            ${planOutput.slice(0, 60000)}
            \`\`\`
            </details>
            
            *Pushed by: ${{ github.actor }}*`;
            
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.data.find(c => 
              c.user.type === 'Bot' && c.body.includes('Terraform Plan')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment || 'staging' }}-${{ github.sha }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 30

      - name: Fail on plan error
        if: steps.plan.outcome != 'success'
        run: exit 1
