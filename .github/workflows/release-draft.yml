name: Release Draft

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to create draft release for"
        required: false
        default: main
        type: string
      version_bump:
        description: "Version bump type"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    name: Draft Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Determine next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          BUMP="${{ github.event.inputs.version_bump || 'auto' }}"
          if [ "$BUMP" == "auto" ]; then
            if git log "$LATEST_TAG..HEAD" --oneline | grep -q "BREAKING\|!:"; then
              BUMP="major"
            elif git log "$LATEST_TAG..HEAD" --oneline | grep -q "^feat"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi

          npm version "$BUMP" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          npx release-notes-generator \
            --from ${{ steps.version.outputs.latest_tag }} \
            --to HEAD \
            --output release-notes.md

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: ${{ steps.version.outputs.new_version }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            CHANGELOG.md

      - name: Create release PR
        run: |
          BRANCH="release/${{ steps.version.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json
          git commit -m "chore(release): ${{ steps.version.outputs.new_version }}"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release ${{ steps.version.outputs.new_version }}" \
            --body "## Release ${{ steps.version.outputs.new_version }}\n\nDraft release has been created. Review and publish when ready.\n\nSee draft release: ${{ github.server_url }}/${{ github.repository }}/releases" \
            --label release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
