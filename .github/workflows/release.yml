name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          echo "## Release ${{ github.ref_name }}" > $GITHUB_STEP_SUMMARY
          echo "### Assets" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript SDK: built" >> $GITHUB_STEP_SUMMARY
          echo "- Rust crate: built" >> $GITHUB_STEP_SUMMARY
          echo "- Python package: built" >> $GITHUB_STEP_SUMMARY
          echo "- Docker images: published to GHCR" >> $GITHUB_STEP_SUMMARY
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CHANGELOG.md
            sbom.spdx.json
