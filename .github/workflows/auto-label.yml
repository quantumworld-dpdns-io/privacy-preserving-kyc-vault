name: Auto Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label-based-on-paths:
    name: Label by Changed Paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  label-based-on-title:
    name: Label by Title Convention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toLowerCase();
            const labels = [];
            if (/^fix|^bug|^hotfix/.test(title)) labels.push('bug');
            if (/^feat|^feature/.test(title)) labels.push('enhancement');
            if (/^chore/.test(title)) labels.push('chore');
            if (/^docs|^documentation/.test(title)) labels.push('documentation');
            if (/^refactor/.test(title)) labels.push('refactor');
            if (/^test/.test(title)) labels.push('testing');
            if (/^deps|^depend/.test(title)) labels.push('dependencies');
            if (/^sec|^security/.test(title)) labels.push('security');
            if (/^perf|^perform/.test(title)) labels.push('performance');
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }

  label-size:
    name: Label by PR Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const additions = context.payload.pull_request.additions;
            const labels = new Set();
            if (additions <= 50) labels.add('size/small');
            else if (additions <= 300) labels.add('size/medium');
            else if (additions <= 1000) labels.add('size/large');
            else labels.add('size/xl');
            const existingLabels = context.payload.pull_request.labels.map(l => l.name);
            const toRemove = existingLabels.filter(l => l.startsWith('size/'));
            for (const label of toRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label
                });
              } catch (e) {}
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: Array.from(labels)
            });

  label-semver:
    name: Label by Semantic Version Impact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toLowerCase();
            const labels = [];
            if (/^major|^breaking|^break\(/.test(title) || title.includes('!:')) labels.push('semver/major');
            else if (/^feat/.test(title)) labels.push('semver/minor');
            else labels.push('semver/patch');
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels
            });
