name: Automated Dependency Update

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      package_manager:
        description: "Package manager (npm, pip, maven)"
        default: "npm"
        type: choice
        options:
          - npm
          - pip
          - maven

permissions:
  contents: write
  pull-requests: write

jobs:
  update-npm:
    name: Update npm Dependencies
    if: github.event.inputs.package_manager == '' || github.event.inputs.package_manager == 'npm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check for outdated packages
        id: outdated
        run: |
          npx npm-check-updates --target latest > outdated-report.txt
          COUNT=$(npx npm-check-updates --target latest | grep -c "^ " || true)
          echo "outdated_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT outdated packages"

      - name: Create update branch and PR
        if: steps.outdated.outputs.outdated_count > 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="deps/npm-update-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          npx npm-check-updates --target latest -u
          npm install
          git add package.json package-lock.json
          git commit -m "chore(deps): update npm dependencies $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(deps): update npm dependencies $(date +%Y-%m-%d)" \
            --body "Automated npm dependency update.\n\nSee \`outdated-report.txt\` for details.\n\n> **Note**: Review changes carefully before merging." \
            --label dependencies,automated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-pip:
    name: Update pip Dependencies
    if: github.event.inputs.package_manager == 'pip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Update requirements
        run: |
          BRANCH="deps/pip-update-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          pip-compile --upgrade requirements.in -o requirements.txt
          git add requirements.txt
          git commit -m "chore(deps): update pip dependencies $(date +%Y-%m-%d)" || echo "No changes"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(deps): update pip dependencies $(date +%Y-%m-%d)" \
            --body "Automated pip dependency update." \
            --label dependencies,automated

      - name: Upload requirements diff
        uses: actions/upload-artifact@v4
        with:
          name: pip-requirements-${{ github.run_id }}
          path: requirements.txt

  update-maven:
    name: Update Maven Dependencies
    if: github.event.inputs.package_manager == 'maven'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check for updates
        run: |
          mvn versions:display-dependency-updates > mvn-updates.txt
          mvn versions:display-plugin-updates >> mvn-updates.txt

      - name: Create update PR
        run: |
          BRANCH="deps/mvn-update-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          mvn versions:use-latest-releases versions:use-latest-versions
          git add pom.xml
          git commit -m "chore(deps): update maven dependencies $(date +%Y-%m-%d)" || echo "No changes"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(deps): update maven dependencies $(date +%Y-%m-%d)" \
            --body "Automated Maven dependency update." \
            --label dependencies,automated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
