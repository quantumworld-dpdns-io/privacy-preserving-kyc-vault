name: Release RC

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "RC version (e.g. 3.0.0-rc.2)"
        required: true
        type: string
      previous_version:
        description: "Previous version for changelog diff"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-rc:
    name: Prepare RC Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Update version
        run: |
          npm version ${{ github.event.inputs.release_version }} --no-git-tag-version
          echo "${{ github.event.inputs.release_version }}" > VERSION

      - name: Generate changelog
        run: |
          PREV="${{ github.event.inputs.previous_version }}"
          if [ -z "$PREV" ]; then
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi
          if [ -n "$PREV" ]; then
            echo "## Changelog (since $PREV)" > CHANGELOG.md
            git log "$PREV..HEAD" --oneline --no-decorate >> CHANGELOG.md
          else
            echo "## Initial RC" > CHANGELOG.md
          fi
          cat CHANGELOG.md

      - name: Create RC tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json VERSION CHANGELOG.md
          git commit -m "chore(release): rc v${{ github.event.inputs.release_version }}"
          git tag "v${{ github.event.inputs.release_version }}"
          git push origin "v${{ github.event.inputs.release_version }}"
          git push origin HEAD:main

      - name: Create GitHub Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.release_version }}
          name: v${{ github.event.inputs.release_version }} (Release Candidate)
          body_path: CHANGELOG.md
          prerelease: true
          generate_release_notes: true
