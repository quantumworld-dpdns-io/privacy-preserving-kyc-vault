name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read
  deployments: write

env:
  BENCHMARK_DIR: tests/benchmarks
  BASELINE_REF: main
  BENCHMARK_RESULTS_DIR: benchmark-results

jobs:
  run-benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run benchmark suite
        run: |
          mkdir -p ${{ env.BENCHMARK_RESULTS_DIR }}
          node tests/benchmarks/runner.js --output ${{ env.BENCHMARK_RESULTS_DIR }}/current.json

      - name: Upload current benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-current
          path: ${{ env.BENCHMARK_RESULTS_DIR }}/current.json
          retention-days: 90

  compare-baseline:
    name: Compare with Baseline
    runs-on: ubuntu-latest
    needs: run-benchmarks
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_REF }}
          path: baseline-checkout

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Download current results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-current
          path: ${{ env.BENCHMARK_RESULTS_DIR }}

      - name: Run baseline benchmarks
        run: |
          cd baseline-checkout
          npm ci
          node tests/benchmarks/runner.js --output ../${{ env.BENCHMARK_RESULTS_DIR }}/baseline.json

      - name: Compare results
        id: comparison
        run: |
          node scripts/compare-benchmarks.js \
            --baseline ${{ env.BENCHMARK_RESULTS_DIR }}/baseline.json \
            --current ${{ env.BENCHMARK_RESULTS_DIR }}/current.json \
            --output ${{ env.BENCHMARK_RESULTS_DIR }}/comparison.md \
            --threshold-percent 10

      - name: Comment PR with benchmark comparison
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comparison = fs.readFileSync('${{ env.BENCHMARK_RESULTS_DIR }}/comparison.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Benchmark Results\n\n${comparison}`
            });

      - name: Fail on performance regression
        run: |
          if grep -q "REGRESSION" ${{ env.BENCHMARK_RESULTS_DIR }}/comparison.md; then
            echo "::error::Performance regression detected (≥10% degradation)"
            exit 1
          fi

  upload-to-storage:
    name: Upload Results to Storage
    runs-on: ubuntu-latest
    needs: run-benchmarks
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download current results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-current
          path: ${{ env.BENCHMARK_RESULTS_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          aws s3 cp ${{ env.BENCHMARK_RESULTS_DIR }}/current.json \
            s3://${{ vars.BENCHMARK_BUCKET }}/${{ github.sha }}-${TIMESTAMP}.json
          aws s3 cp ${{ env.BENCHMARK_RESULTS_DIR }}/current.json \
            s3://${{ vars.BENCHMARK_BUCKET }}/latest.json
