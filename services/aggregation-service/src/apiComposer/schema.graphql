# Root Query and Mutation Types
type Query {
  # Stripe Queries
  getPaymentIntent(id: ID!): PaymentIntent!
  
  # Plaid Queries
  getPlaidLinkToken(userData: PlaidLinkTokenInput!): LinkTokenResponse!
  exchangePlaidPublicToken(publicToken: String!): String!
  getPlaidAccounts(accessToken: String!): [PlaidAccount!]!
  getPlaidTransactions(accessToken: String!, startDate: String, endDate: String, count: Int, offset: Int): PlaidTransactionsResponse!
  getPlaidIdentity(accessToken: String!): PlaidIdentity!
  
  # Jumio Queries
  getJumioVerificationStatus(merchantScanReference: String!): JumioVerification!
  getJumioVerificationResult(merchantScanReference: String!): JumioResult!
  
  # Onfido Queries
  getOnfidoApplicant(applicantId: String!): OnfidoApplicant!
  getOnfidoDocument(documentId: String!): OnfidoDocument!
  getOnfidoCheckStatus(checkId: String!): OnfidoCheck!
  getOnfidoCheckResult(checkId: String!): OnfidoCheck!
  
  # Experian Queries
  getExperianCreditReport(individualData: ExperianIndividualInput!): ExperianCreditReport!
  getExperianCreditScore(individualData: ExperianIndividualInput!): ExperianCreditScore!
  verifyExperianIdentity(individualData: ExperianIndividualInput!): ExperianIdentityVerification!
  
  # Equifax Queries
  getEquifaxCreditReport(individualData: EquifaxIndividualInput!): EquifaxCreditReport!
  getEquifaxCreditScore(individualData: EquifaxIndividualInput!): EquifaxCreditScore!
  verifyEquifaxIdentity(individualData: EquifaxIndividualInput!): EquifaxIdentityVerification!
  
  # Google Maps Queries
  geocodeAddress(input: GeocodeInput!): GeocodeResult!
  reverseGeocode(input: ReverseGeocodeInput!): ReverseGeocodeResult!
  validateAddress(input: ValidateAddressInput!): Boolean!
  getPlaceDetails(placeId: String!): PlaceDetailsResult!
  
  # Web3 Queries
  getEthBalance(input: Web3BalanceInput!): Web3Balance!
  getTokenBalance(input: Web3TokenBalanceInput!): Web3TokenBalance!
  getBlockNumber(input: Web3BlockNumberInput!): Web3BlockNumber!
  getTransactionReceipt(input: Web3TransactionReceiptInput!): Web3TransactionReceipt!
  callContractMethod(input: Web3ContractCallInput!): String!
  
  # OAuth Queries
  verifyGoogleToken(input: GoogleTokenInput!): GoogleUserInfo!
  getGoogleUserInfo(input: GoogleAccessTokenInput!): GoogleUserInfo!
  verifyFacebookToken(input: FacebookAccessTokenInput!): FacebookUserInfo!
  verifyAppleToken(input: AppleIdentityTokenInput!): AppleUserInfo!
}

type Mutation {
  # Stripe Mutations
  createPaymentIntent(paymentData: PaymentIntentInput!): PaymentIntent!
  confirmPaymentIntent(paymentIntentId: ID!, confirmData: PaymentIntentConfirmInput!): PaymentIntent!
  createRefund(refundData: RefundInput!): Refund!
  
  # Plaid Mutations
  createPlaidLinkToken(userData: PlaidLinkTokenInput!): LinkTokenResponse!
  exchangePlaidPublicToken(publicToken: String!): String!
  
  # Jumio Mutations
  createJumioVerification(verificationData: JumioVerificationInput!): JumioVerification!
  
  # Onfido Mutations
  createOnfidoApplicant(applicantData: OnfidoApplicantInput!): OnfidoApplicant!
  uploadOnfidoDocument(applicantId: String!, file: String!, fileType: String!): OnfidoDocument!
  createOnfidoCheck(checkData: OnfidoCheckInput!): OnfidoCheck!
  
  # Twilio Mutations
  sendTwilioSms(messageData: TwilioSmsInput!): TwilioMessage!
  sendTwilioWhatsApp(messageData: TwilioWhatsAppInput!): TwilioMessage!
  makeTwilioCall(callData: TwilioCallInput!): TwilioCall!
  verifyTwilioPhone(verifyData: TwilioVerifyInput!): TwilioVerification!
  checkTwilioVerification(checkData: TwilioCheckVerificationInput!): TwilioVerificationCheck!
  
  # SendGrid Mutations
  sendSendGridEmail(emailData: SendGridEmailInput!): SendGridEmailResponse!
  sendSendGridMultipleEmails(emailDataArray: [SendGridEmailInput!]!): [SendGridEmailResponse!]!
  
  # SES Mutations
  sendSesEmail(emailData: SesEmailInput!): SesEmailResponse!
  sendSesRawEmail(emailData: SesRawEmailInput!): SesEmailResponse!
  
  # S3 Mutations
  uploadS3File(uploadParams: S3UploadInput!): S3UploadResponse!
  deleteS3File(deleteParams: S3DeleteInput!): String!
  getS3SignedUrl(urlParams: S3UrlInput!): String!
}