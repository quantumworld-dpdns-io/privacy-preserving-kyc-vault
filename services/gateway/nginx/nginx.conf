user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # PQC TLS Configuration (using hybrid certificates for now, as full PQC TLS is not yet widely supported in nginx)
    # In production, you would use PQC-enabled OpenSSL and certificates
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Hybrid cipher suite: ECDHE + PQC (for demonstration, using existing ciphers as placeholders)
    # In a real PQC setup, you would use algorithms like KYBER, DILITHIUM, etc.
    ssl_ciphers             TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # OCSP Stapling
    ssl_stapling            on;
    ssl_stapling_verify     on;
    resolver                8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout        5s;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Upstream services
    upstream did_service {
        server did-service:3001;
    }

    upstream credential_service {
        server credential-service:3002;
    }

    upstream kyc_service {
        server kyc-service:3003;
    }

    upstream zkp_service {
        server zkp-service:3004;
    }

    upstream billing_service {
        server billing-service:3005;
    }

    upstream webhook_service {
        server webhook-service:3006;
    }

    upstream admin_service {
        server admin-service:3007;
    }

    # API Gateway
    server {
        listen 80;
        listen [::]:80;
        server_name  _;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name  _;

        # SSL Configuration (placeholder for PQC)
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";

        # API Gateway Routes
        location /api/v1/did/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://did_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  90s;
        }

        location /api/v1/credentials/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://credential_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  90s;
        }

        location /api/v1/kyc/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://kyc_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  90s;
        }

        location /api/v1/zkp/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://zkp_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  90s;
        }

        location /api/v1/billing/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://billing_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  90s;
        }

        location /api/v1/webhook/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://webhook_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  90s;
        }

        location /api/v1/admin/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://admin_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  90s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # Default 404
        location / {
            return 404;
        }
    }
}
