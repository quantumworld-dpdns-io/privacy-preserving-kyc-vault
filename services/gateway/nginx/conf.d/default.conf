upstream did_service {
    server did-service:3001;
}

upstream credential_service {
    server credential-service:3002;
}

upstream kyc_service {
    server kyc-service:3003;
}

upstream zkp_service {
    server zkp-service:3004;
}

upstream billing_service {
    server billing-service:3005;
}

upstream webhook_service {
    server webhook-service:3006;
}

upstream admin_service {
    server admin-service:3007;
}

server {
    listen 80;
    server_name localhost kyc-vault.local;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name localhost kyc-vault.local;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # SSL optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API Routes
    location /api/v1/did/ {
        proxy_pass http://did_service;
    }

    location /api/v1/credentials/ {
        proxy_pass http://credential_service;
    }

    location /api/v1/kyc/ {
        proxy_pass http://kyc_service;
    }

    location /api/v1/zkp/ {
        proxy_pass http://zkp_service;
    }

    location /api/v1/billing/ {
        proxy_pass http://billing_service;
    }

    location /api/v1/webhook/ {
        proxy_pass http://webhook_service;
    }

    location /api/v1/admin/ {
        proxy_pass http://admin_service;
    }

    # Health check
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
