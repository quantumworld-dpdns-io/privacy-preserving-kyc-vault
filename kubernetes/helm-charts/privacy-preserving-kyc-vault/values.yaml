replicaCount: 2

image:
  repository: privacy-preserving-kyc-vault
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Database configuration
database:
  host: ""
  port: 5432
  name: kyc_vault
  username: ""
  password: ""

# Redis configuration
redis:
  host: ""
  port: 6379
  password: ""

# Kafka configuration
kafka:
  bootstrapServers: ""
  securityProtocol: ""
  saslMechanism: ""
  saslJaasConfig: ""

# Weaviate configuration
weaviate:
  host: ""
  port: 8080
  grpcPort: 50051

# Neptune configuration
neptune:
  host: ""
  port: 8182
  iamAuthEnabled: false

# Service account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Additional volumes
volumes: []
  # - name: weaviate-data
  #   persistentVolumeClaim:
  #     claimName: weaviate-data-pvc

# Additional volume mounts
volumeMounts: []
  # - name: weaviate-data
  #   mountPath: /var/lib/weaviate
  #   readOnly: false

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

# Startup probe for applications that need more time to initialize
startupProbe:
  httpGet:
    path: /startup
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# Custom labels
labels: {}

# Custom annotations
annotations: {}

# Priority class
priorityClassName: ""

# Enable/disable specific components
components:
  api:
    enabled: true
  processor:
    enabled: true
  weaviate:
    enabled: true
  neptune:
    enabled: true
