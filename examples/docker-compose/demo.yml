  #     - kyc-vault
  #
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: kyc-grafana
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - grafanadata:/var/lib/grafana
  #   logging: *default-logging
  #   networks:
  #     - kyc-vault

volumes:
  pgdata:
  redisdata:
  miniodata:
  weaviatedata:
  ollamadata:
  # promdata:
  # grafanadata:

networks:
  kyc-vault:
    name: kyc-vault-demo
    driver: bridge
