[package]
name = "kyc-vault-wasm-runtime"
version.workspace = true
description = "Wasmtime-based runtime for executing WebAssembly credential verification modules in KYC Vault"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.wasm]
module = "kyc-vault-wasm-runtime"

[dependencies]
anyhow = "1"
parking_lot = "0.12"
tracing = "0.1"
wasmtime = { version = "25", features = ["async", "cranelift"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
async-runtime = ["wasmtime/async"]
cache = ["wasmtime/cache"]

[lints]
workspace = true
