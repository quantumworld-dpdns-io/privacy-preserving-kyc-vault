[package]
name = "kyc-vault-wasm-runtime"
version.workspace = true
description = "Wasmtime-based runtime for executing WebAssembly credential verification modules in KYC Vault"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.wasm]
module = "kyc-vault-wasm-runtime"

[dependencies]
anyhow = "1"
parking_lot = "0.12"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
blake3 = "1"
rand = "0.8"
wasmtime = { version = "25", features = ["async", "cranelift", "cache"] }

[dev-dependencies]
tempfile = "3"
wat = "1"

[features]
default = []
async-runtime = ["wasmtime/async"]
cache = ["wasmtime/cache"]

[lints]
workspace = true
