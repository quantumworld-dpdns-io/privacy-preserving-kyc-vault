[package]
name = "privacy-preserving-kyc-vault-quantum"
version = "0.1.0"
edition = "2021"
description = "Quantum computing features for privacy-preserving KYC vault"
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
num-complex = "0.4"
ndarray = "0.15"
ndarray-linalg = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion = "0.4"
tempfile = "3.0"