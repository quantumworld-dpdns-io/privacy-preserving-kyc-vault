[package]
name = "privacy-preserving-kyc-vault-quantum"
version = "0.1.0"
edition = "2021"
description = "Quantum computing features for privacy-preserving KYC vault"
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
num-complex = "0.4"
ndarray = "0.15"
ndarray-linalg = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
blas-src = "0.1"
lapack-src = "0.1"
rustls = "0.20"
webpki = "0.22"
ring = "0.16"
rayon = "1.7"
parking_lot = "0.12"
once_cell = "1.18"
lazy_static = "1.4"
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
criterion = "0.4"
tempfile = "3.0"
proptest = "1.4"
