[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/zkp",
    "crates/crypto-pqc",
    "crates/wasm-runtime",
    "crates/api-grpc",
    "crates/tee",
    "crates/did",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/quantumworld-dpdns-io/privacy-preserving-kyc-vault"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = "2"
x25519-dalek = "2"
aes-gcm = "0.10"
bls-signatures = { version = "0.16", features = ["bls12_381"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
