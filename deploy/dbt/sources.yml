version: 2

sources:
  - name: kyc_vault
    database: kyc_vault
    schema: public
    tables:
      - name: credentials
        description: "Core credential records issued to platform users"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: platform_user_id
            description: "User identifier on the platform"
          - name: platform
            description: "Platform name"
          - name: credential_type
            description: "Type of credential issued"
          - name: status
            description: "Credential status (pending/approved/rejected/revoked)"
          - name: issued_at
            description: "Timestamp when credential was issued"
          - name: expires_at
            description: "Timestamp when credential expires"
          - name: verified_at
            description: "Timestamp when credential was verified"
          - name: is_revoked
            description: "Flag indicating if credential was revoked"
          - name: metadata
            description: "JSON metadata blob"
        freshness:
          warn_after: { count: 24, period: hour }
          error_after: { count: 48, period: hour }
        loaded_at_field: updated_at

      - name: kyc_workflows
        description: "KYC workflow instances"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: user_id
            description: "User identifier"
          - name: workflow_type
            description: "Type of KYC workflow"
          - name: status
            description: "Workflow status"
          - name: risk_score
            description: "Computed risk score for the workflow"
        freshness:
          warn_after: { count: 24, period: hour }
          error_after: { count: 72, period: hour }
        loaded_at_field: updated_at

      - name: platforms
        description: "Registered platform entities"
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: name
          - name: config
