apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: kyc-vault-restricted-psp
  labels:
    app.kubernetes.io/name: kyc-vault
    app.kubernetes.io/component: pod-security-policy
  annotations:
    seccomp.security.alpha.kubernetes.io/allowedProfileNames: "RuntimeDefault"
    seccomp.security.alpha.kubernetes.io/defaultProfileName: "RuntimeDefault"
    apparmor.security.beta.kubernetes.io/allowedProfileNames: "runtime/default"
    apparmor.security.beta.kubernetes.io/defaultProfileName: "runtime/default"
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  allowedCapabilities:
    - NET_BIND_SERVICE
  volumes:
    - configMap
    - emptyDir
    - projected
    - secret
    - downwardAPI
    - persistentVolumeClaim
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: MustRunAsNonRoot
    ranges:
      - min: 1000
        max: 2000
  supplementalGroups:
    rule: MustRunAs
    ranges:
      - min: 1000
        max: 2000
  fsGroup:
    rule: MustRunAs
    ranges:
      - min: 1000
        max: 2000
  seLinux:
    rule: RunAsAny
  readOnlyRootFilesystem: true
