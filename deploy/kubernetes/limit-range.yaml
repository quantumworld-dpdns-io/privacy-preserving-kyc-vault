apiVersion: v1
kind: LimitRange
metadata:
  name: kyc-vault-limits
  namespace: kyc-vault
  labels:
    app.kubernetes.io/name: kyc-vault
    app.kubernetes.io/component: limit-range
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container
