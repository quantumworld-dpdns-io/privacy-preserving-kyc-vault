# SealedSecret template for KYC Vault secrets
# Usage:
#   1. Replace placeholders with actual base64-encoded values
#   2. Use kubeseal to create a SealedSecret:
#      kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#
# DO NOT commit this file with real secrets.
# Instead, commit the output of kubeseal (sealed-secret.yaml)
# which can only be decrypted by the Sealed Secrets controller
# running in the cluster.
---
apiVersion: v1
kind: Secret
metadata:
  name: kyc-vault-secrets
  namespace: kyc-vault
  labels:
    app.kubernetes.io/name: kyc-vault
    app.kubernetes.io/component: secrets
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
stringData:
  # Database credentials
  DB_USER: "kyc_admin"
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  DB_CONNECTION_POOL_MIN: "5"
  DB_CONNECTION_POOL_MAX: "50"

  # Redis credentials
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"

  # API authentication
  API_JWT_SECRET: "CHANGE_ME_JWT_SECRET_32_BYTES_BASE64"
  API_JWT_ISSUER: "kyc-vault-api"
  API_JWT_AUDIENCE: "kyc-vault"
  API_JWT_EXPIRY: "3600"
  API_RATE_LIMIT_REDIS_PASSWORD: "CHANGE_ME_RATE_LIMIT_PASSWORD"
  API_WEBHOOK_SECRET: "CHANGE_ME_WEBHOOK_SECRET"

  # mTLS configuration
  MTLS_CLIENT_CERT: ""
  MTLS_CLIENT_KEY: ""
  MTLS_CA_CERT: ""

  # HashiCorp Vault
  VAULT_TOKEN: "CHANGE_ME_VAULT_TOKEN"
  VAULT_UNSEAL_KEY: "CHANGE_ME_UNSEAL_KEY_1_OF_5"

  # Encryption keys
  ENCRYPTION_MASTER_KEY: "CHANGE_ME_MASTER_KEY_32_BYTES"
  ENCRYPTION_KEY_ROTATION_INTERVAL: "7776000"

  # JWT keys
  JWT_PRIVATE_KEY: ""
  JWT_PUBLIC_KEY: ""

  # Webhook secrets
  WEBHOOK_API_KEY: "CHANGE_ME_WEBHOOK_API_KEY"
  WEBHOOK_SIGNING_KEY: "CHANGE_ME_WEBHOOK_SIGNING_KEY"

  # External service keys
  STRIPE_API_KEY: "CHANGE_ME_STRIPE_API_KEY"
  STRIPE_WEBHOOK_SECRET: "CHANGE_ME_STRIPE_WEBHOOK_SECRET"
  SENDGRID_API_KEY: "CHANGE_ME_SENDGRID_API_KEY"
  TWILIO_ACCOUNT_SID: "CHANGE_ME_TWILIO_SID"
  TWILIO_AUTH_TOKEN: "CHANGE_ME_TWILIO_TOKEN"

  # Monitoring
  GRAFANA_CLOUD_API_KEY: ""
  DATADOG_API_KEY: ""

  # Wasm module signing keys (public)
  WASM_SIGNER_PUBLIC_KEY_0: ""
  WASM_SIGNER_PUBLIC_KEY_1: ""
  WASM_SIGNER_PUBLIC_KEY_2: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: kyc-vault-tls
  namespace: kyc-vault
  labels:
    app.kubernetes.io/name: kyc-vault
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
stringData:
  # TLS certificate and key for the API gateway
  tls.crt: ""
  tls.key: ""
  ca.crt: ""
