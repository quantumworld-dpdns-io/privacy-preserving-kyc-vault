apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyc-vault
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: kyc-vault

  source:
    repoURL: https://github.com/org/privacy-preserving-kyc-vault.git
    targetRevision: HEAD
    path: deploy/helm
    helm:
      valueFiles:
      - values/production.yaml
      releaseName: kyc-vault

  destination:
    server: https://kubernetes.default.svc
    namespace: kyc-vault

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
  - group: autoscaling
    kind: HorizontalPodAutoscaler
    jsonPointers:
    - /spec/metrics
