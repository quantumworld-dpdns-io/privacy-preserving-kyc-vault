groups:
  - name: resource_usage
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "CPU usage above 85%"
          description: "CPU usage on {{ $labels.instance }} is {{ $value }}%."
          runbook_url: "https://docs.privacy-vault.com/runbooks/high-cpu"

      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "CPU usage above 95%"
          description: "CPU usage on {{ $labels.instance }} is {{ $value }}%."

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Memory usage above 85%"
          description: "Memory usage on {{ $labels.instance }} is {{ $value }}%."

      - alert: CriticalMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 95
        for: 3m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Memory usage above 95%"
          description: "Memory usage on {{ $labels.instance }} is {{ $value }}%."

      - alert: DiskSpaceRunningOut
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Disk space below 15% available"
          description: "Disk available on {{ $labels.instance }} mount {{ $labels.mountpoint }} is {{ $value }}%."

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) * 100 < 5
        for: 2m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Disk space below 5% available"
          description: "Disk available on {{ $labels.instance }} is {{ $value }}%."

      - alert: HighDiskIO
        expr: rate(node_disk_io_time_seconds_total[5m]) > 0.8
        for: 15m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High disk I/O utilization"
          description: "Disk I/O on {{ $labels.instance }} device {{ $labels.device }} is at {{ $value | humanizePercentage }}."

      - alert: NetworkReceiveErrors
        expr: rate(node_network_receive_errors_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Network receive errors detected"
          description: "Network receive errors on {{ $labels.instance }} interface {{ $labels.device }}."

      - alert: OOMKillDetected
        expr: rate(node_vmstat_oom_kill[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "OOM kill detected"
          description: "OOM kills occurring on {{ $labels.instance }} at rate {{ $value }}/s."

      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[5m]) > 3
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Pod is crash looping"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value }} times."

      - alert: PodPending
        expr: kube_pod_status_phase{phase="Pending"} > 0
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Pod stuck in Pending state"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been pending for 10 minutes."

      - alert: PersistentVolumeUsageCritical
        expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Persistent volume usage above 85%"
          description: "PV {{ $labels.persistentvolumeclaim }} usage is {{ $value }}%."

      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Node is not ready"
          description: "Node {{ $labels.node }} is in NotReady state."

      - alert: ContainerHighMemoryUsage
        expr: (container_memory_working_set_bytes / container_spec_memory_limit_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Container memory usage above 90%"
          description: "Container {{ $labels.container }} on {{ $labels.pod }} is using {{ $value }}% of memory limit."

      - alert: ContainerHighCPUUsage
        expr: rate(container_cpu_usage_seconds_total[5m]) / container_spec_cpu_quota * 100 > 90
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Container CPU usage above 90%"
          description: "Container {{ $labels.container }} on {{ $labels.pod }} is using {{ $value }}% of CPU limit."
