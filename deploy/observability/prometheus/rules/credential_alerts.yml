groups:
  - name: credential_operations
    interval: 30s
    rules:
      - alert: CredentialIssuanceFailure
        expr: rate(credential_issuance_errors_total[5m]) / rate(credential_issuance_requests_total[5m]) > 0.03
        for: 5m
        labels:
          severity: critical
          team: credentials
        annotations:
          summary: "Credential issuance failure rate above 3%"
          description: "Issuance error rate is {{ $value | humanizePercentage }} for the last 5 minutes."
          runbook_url: "https://docs.privacy-vault.com/runbooks/credential-issuance-failure"

      - alert: CredentialVerificationFailure
        expr: rate(credential_verification_errors_total[5m]) / rate(credential_verification_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          team: credentials
        annotations:
          summary: "Credential verification failure rate above 5%"
          description: "Verification error rate is {{ $value | humanizePercentage }} for the last 5 minutes."
          runbook_url: "https://docs.privacy-vault.com/runbooks/credential-verification-failure"

      - alert: CredentialRevocationSpike
        expr: rate(credential_revocation_requests_total[5m]) > 100
        for: 2m
        labels:
          severity: warning
          team: credentials
        annotations:
          summary: "Spike in credential revocation requests"
          description: "Revocation rate is {{ $value }} ops/s, potential compromise scenario."

      - alert: CredentialExpiryApproaching
        expr: credential_days_until_expiry < 30
        labels:
          severity: warning
          team: credentials
        annotations:
          summary: "Credentials approaching expiry"
          description: "{{ $value }} credentials will expire within 30 days."

      - alert: CredentialSigningKeyExpiry
        expr: credential_signing_key_expiry_timestamp - time() < 604800
        labels:
          severity: critical
          team: credentials
        annotations:
          summary: "Credential signing key expiring soon"
          description: "Signing key for {{ $labels.key_id }} expires in {{ $value | humanizeDuration }}."

      - alert: CredentialStatusListSize
        expr: credential_status_list_size > 10000
        for: 15m
        labels:
          severity: warning
          team: credentials
        annotations:
          summary: "Credential status list is growing large"
          description: "Status list contains {{ $value }} entries; consider pruning revoked credentials."

      - alert: CredentialSchemaChangeHighRate
        expr: rate(credential_schema_changes_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
          team: credentials
        annotations:
          summary: "High rate of credential schema changes"
          description: "Schema change rate is {{ $value }} changes/min. Verify these are authorized."

      - alert: CredentialPresentationSizeExceeded
        expr: credential_presentation_size_bytes > 1048576
        labels:
          severity: warning
          team: credentials
        annotations:
          summary: "Credential presentation exceeds 1MB"
          description: "Presentation size is {{ $value | humanizeBytes }}. Large presentations may cause verification delays."

      - alert: CredentialDelegationChainDepth
        expr: credential_delegation_chain_depth > 5
        labels:
          severity: warning
          team: credentials
        annotations:
          summary: "Credential delegation chain depth exceeded"
          description: "Delegation chain depth is {{ $value }}. Maximum recommended depth is 5."
