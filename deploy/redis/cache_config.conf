# ============================================================
# Redis Configuration - KYC Vault Cache Layer
# ============================================================
# Used for: session caching, rate limiting, ZKP proof cache,
# credential vector cache, API response cache

# Basic settings
daemonize no
pidfile /var/run/redis_6379.pid
port 6379
tcp-backlog 511
bind 0.0.0.0
unixsocket /tmp/redis.sock
unixsocketperm 700
timeout 0
tcp-keepalive 300

# ============================================================
# Memory Management
# ============================================================
maxmemory 4gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# Eviction policy details:
# allkeys-lru: Evict any key using approximate LRU
# This is appropriate because:
#   - Session data is ephemeral and can be regenerated
#   - Rate limiter counters can be recomputed
#   - ZKP proof cache can be re-proven
#   - API response cache can be re-fetched

# ============================================================
# Persistence (AOF + RDB hybrid)
# ============================================================
# RDB snapshots
save 900 1       # 15 min if at least 1 key changed
save 300 10      # 5 min if at least 10 keys changed
save 60 10000    # 1 min if at least 10000 keys changed
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
rdb-del-sync-files no
dir /data/redis

# AOF configuration
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ============================================================
# Security
# ============================================================
requirepass ${REDIS_PASSWORD}
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command DEBUG ""
rename-command SLAVEOF ""
rename-command REPLICAOF ""
rename-command SAVE ""
rename-command BGSAVE ""

# ACL configuration
aclfile /etc/redis/users.acl

# ============================================================
# Replication (for high availability)
# ============================================================
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100
replica-lazy-flush no
replica-announce-ip ${REDIS_REPLICA_IP}
replica-announce-port 6379

# Sentinel configuration
sentinel monitor kyc-cache-master ${REDIS_MASTER_HOST} 6379 2
sentinel down-after-milliseconds kyc-cache-master 5000
sentinel failover-timeout kyc-cache-master 60000
sentinel parallel-syncs kyc-cache-master 1

# ============================================================
# Connection Management
# ============================================================
maxclients 10000
timeout 300
tcp-keepalive 300
hz 10
dynamic-hz yes

# ============================================================
# Keyspace Notifications (for cache invalidation)
# ============================================================
notify-keyspace-events Ex

# ============================================================
# Slow Log & Monitoring
# ============================================================
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

# ============================================================
# Advanced Configuration
# ============================================================
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
jemalloc-bg-thread yes

# ============================================================
# Cache-Specific Key Patterns
# ============================================================
# Session cache: sess:{session_id} -> TTL 3600s
# Rate limiter: ratelimit:{ip}:{endpoint} -> TTL 60s
# ZKP proof cache: zkp:{proof_hash} -> TTL 3600s
# Credential vector: vec:{credential_id} -> TTL 86400s
# API response cache: api:{method}:{path}:{hash} -> TTL 300s
# DID document: did:{did_string} -> TTL 3600s
# Rate limit bucket: rl:{identifier}:{action} -> TTL varies
