apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyc-vault
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./deploy/helm
  prune: true
  sourceRef:
    kind: GitRepository
    name: kyc-vault
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: kyc-vault
    namespace: kyc-vault
  timeout: 2m0s
  retryInterval: 30s
  force: true
  postBuild:
    substitute:
      environment: production
      cluster_region: us-east-1
    substituteFrom:
    - kind: ConfigMap
      name: cluster-vars
  patches:
  - patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kyc-vault
        namespace: kyc-vault
      spec:
        valuesFrom:
        - kind: ConfigMap
          name: kyc-vault-values
          valuesKey: values-production.yaml
    target:
      kind: HelmRelease
      name: kyc-vault
