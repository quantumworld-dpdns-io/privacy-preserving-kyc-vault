# Tetragon TracingPolicy: File Integrity Monitoring for Sensitive Paths
# Monitors file access, modification, and deletion on critical paths

apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "kyc-file-integrity-monitor"
  namespace: kyc-vault
spec:
  kprobes:
    # ============================================================
    # Openat - all sensitive path access
    # ============================================================
    - call: "sys_openat"
      syscall: true
      args:
        - index: 1
          type: "string"
          name: "pathname"
        - index: 2
          type: "int"
          name: "flags"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Prefix"
              values:
                - "/etc/kyc-vault"
                - "/var/lib/kyc-vault"
                - "/var/log/kyc-vault"
                - "/etc/ssl/certs"
                - "/etc/kubernetes"
                - "/var/run/secrets"
                - "/mnt/secrets"
                - "/etc/environment"
                - "/etc/ld.so.preload"
                - "/etc/ld.so.conf"
                - "/etc/hosts"
                - "/etc/resolv.conf"
          matchActions:
            - action: "Log"

    - call: "sys_openat"
      syscall: true
      args:
        - index: 1
          type: "string"
          name: "pathname"
        - index: 2
          type: "int"
          name: "flags"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Postfix"
              values:
                - ".yaml"
                - ".yml"
                - ".json"
                - ".tf"
                - ".tfvars"
                - ".env"
                - ".toml"
                - ".ini"
                - ".conf"
                - ".cnf"
                - ".cfg"
          matchArgs:
            - index: 2
              operator: "In"
              values:
                - "65"     # O_WRONLY|O_CREAT
                - "577"    # O_WRONLY|O_CREAT|O_TRUNC
                - "1089"   # O_WRONLY|O_CREAT|O_APPEND
                - "1"      # O_WRONLY
                - "2"      # O_RDWR
          matchActions:
            - action: "Log"

    # ============================================================
    # Unlink (delete) monitoring
    # ============================================================
    - call: "sys_unlinkat"
      syscall: true
      args:
        - index: 0
          type: "int"
          name: "dirfd"
        - index: 1
          type: "string"
          name: "pathname"
        - index: 2
          type: "int"
          name: "flags"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Prefix"
              values:
                - "/etc/kyc-vault"
                - "/var/lib/kyc-vault"
                - "/var/log/kyc-vault"
                - "/mnt/secrets"
          matchActions:
            - action: "SigKill"
            - action: "Log"

    # ============================================================
    # Rename monitoring - file moves/renames
    # ============================================================
    - call: "sys_renameat"
      syscall: true
      args:
        - index: 0
          type: "int"
          name: "olddirfd"
        - index: 1
          type: "string"
          name: "oldpath"
        - index: 2
          type: "int"
          name: "newdirfd"
        - index: 3
          type: "string"
          name: "newpath"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Prefix"
              values:
                - "/etc/kyc-vault"
                - "/var/lib/kyc-vault"
                - "/mnt/secrets"
          matchActions:
            - action: "Log"

    # ============================================================
    # Chmod monitoring - permission changes
    # ============================================================
    - call: "sys_fchmodat"
      syscall: true
      args:
        - index: 0
          type: "int"
          name: "dirfd"
        - index: 1
          type: "string"
          name: "pathname"
        - index: 2
          type: "mode_t"
          name: "mode"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Prefix"
              values:
                - "/etc/kyc-vault"
                - "/var/lib/kyc-vault"
                - "/mnt/secrets"
          matchArgs:
            - index: 2
              operator: "GT"
              values:
                - "493"    # 0755
          matchActions:
            - action: "Log"

    # ============================================================
    # Chown monitoring - ownership changes
    # ============================================================
    - call: "sys_fchownat"
      syscall: true
      args:
        - index: 0
          type: "int"
          name: "dirfd"
        - index: 1
          type: "string"
          name: "pathname"
        - index: 2
          type: "uid_t"
          name: "owner"
        - index: 3
          type: "gid_t"
          name: "group"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Prefix"
              values:
                - "/etc/kyc-vault"
                - "/var/lib/kyc-vault"
                - "/mnt/secrets"
          matchActions:
            - action: "Log"

    # ============================================================
    # Symlink monitoring - potential symlink attacks
    # ============================================================
    - call: "sys_symlinkat"
      syscall: true
      args:
        - index: 0
          type: "string"
          name: "target"
        - index: 1
          type: "int"
          name: "newdirfd"
        - index: 2
          type: "string"
          name: "linkpath"
      selectors:
        - matchArgs:
            - index: 2
              operator: "Prefix"
              values:
                - "/etc/kyc-vault"
                - "/var/lib/kyc-vault"
                - "/mnt/secrets"
          matchActions:
            - action: "SigKill"
            - action: "Log"

    # ============================================================
    # Setxattr monitoring - extended attribute changes
    # ============================================================
    - call: "sys_setxattr"
      syscall: true
      args:
        - index: 0
          type: "string"
          name: "pathname"
        - index: 1
          type: "string"
          name: "name"
        - index: 2
          type: "char[]"
          name: "value"
          sizeArgIndex: 3
        - index: 3
          type: "size_t"
          name: "size"
        - index: 4
          type: "int"
          name: "flags"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/etc/kyc-vault"
                - "/var/lib/kyc-vault"
                - "/mnt/secrets"
          matchActions:
            - action: "Log"

  # ============================================================
  # Tracepoints for file system events
  # ============================================================
  tracepoints:
    - subsystem: "filelock"
      event: "filelock_lock"
      args:
        - index: 0
          type: "string"
          name: "filename"
        - index: 1
          type: "int"
          name: "pid"

    - subsystem: "filelock"
      event: "filelock_unlock"
      args:
        - index: 0
          type: "string"
          name: "filename"
        - index: 1
          type: "int"
          name: "pid"

  # ============================================================
  # Pod selector
  # ============================================================
  podSelector: {}

  spec:
    rateLimit:
      eventsPerSecond: 2000
      burstSize: 200
