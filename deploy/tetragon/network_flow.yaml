# Tetragon TracingPolicy: Network Flow Monitoring for API Traffic
# Tracks all network connections made by KYC Vault pods

apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "kyc-network-flow-monitor"
  namespace: kyc-vault
spec:
  kprobes:
    # ============================================================
    # Connect syscall - outbound connections
    # ============================================================
    - call: "sys_connect"
      syscall: true
      args:
        - index: 0
          type: "int"
          name: "sockfd"
        - index: 1
          type: "sockaddr"
          name: "addr"
        - index: 2
          type: "int"
          name: "addrlen"
      selectors:
        - matchArgs:
            - index: 1
              operator: "NotIn"
              values:
                - "127.0.0.1"
                - "::1"
                - "0.0.0.0"
          matchActions:
            - action: "Log"

    # ============================================================
    # Bind syscall - listening ports
    # ============================================================
    - call: "sys_bind"
      syscall: true
      args:
        - index: 0
          type: "int"
          name: "sockfd"
        - index: 1
          type: "sockaddr"
          name: "addr"
        - index: 2
          type: "int"
          name: "addrlen"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Postfix"
              values:
                - ":9000"
                - ":9001"
                - ":9002"
                - ":9003"
                - ":9004"
                - ":9005"
                - ":9006"
                - ":9010"
                - ":8443"
                - ":443"
                - ":80"
          matchActions:
            - action: "Log"

    # ============================================================
    # Accept syscall - incoming connections
    # ============================================================
    - call: "sys_accept4"
      syscall: true
      args:
        - index: 0
          type: "int"
          name: "sockfd"
        - index: 1
          type: "sockaddr"
          name: "addr"
        - index: 2
          type: "int"
          name: "addrlen"
        - index: 3
          type: "int"
          name: "flags"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Exists"
          matchActions:
            - action: "Log"

    # ============================================================
    # Sendto syscall - UDP / raw datagrams
    # ============================================================
    - call: "sys_sendto"
      syscall: true
      args:
        - index: 0
          type: "int"
          name: "sockfd"
        - index: 1
          type: "char[]"
          name: "buf"
          sizeArgIndex: 2
        - index: 2
          type: "size_t"
          name: "len"
        - index: 3
          type: "int"
          name: "flags"
        - index: 4
          type: "sockaddr"
          name: "dest_addr"
        - index: 5
          type: "int"
          name: "addrlen"
      selectors:
        - matchArgs:
            - index: 4
              operator: "NotIn"
              values:
                - "127.0.0.1"
                - "::1"
          matchActions:
            - action: "Log"

    # ============================================================
    # Recvfrom syscall - incoming data
    # ============================================================
    - call: "sys_recvfrom"
      syscall: true
      args:
        - index: 0
          type: "int"
          name: "sockfd"
        - index: 1
          type: "char[]"
          name: "buf"
          sizeArgIndex: 2
        - index: 2
          type: "size_t"
          name: "size"
        - index: 3
          type: "int"
          name: "flags"
        - index: 4
          type: "sockaddr"
          name: "src_addr"
      selectors:
        - matchArgs:
            - index: 4
              operator: "Exists"
          matchActions:
            - action: "Log"

    # ============================================================
    # Close syscall - connection teardown tracking
    # ============================================================
    - call: "sys_close"
      syscall: true
      args:
        - index: 0
          type: "int"
          name: "fd"
      selectors:
        - matchArgs:
            - index: 0
              operator: "GT"
              values:
                - 2
          matchActions:
            - action: "Log"

  # ============================================================
  # Tracepoints for additional network visibility
  # ============================================================
  tracepoints:
    - subsystem: "skb"
      event: "kfree_skb"
      args:
        - index: 0
          type: "string"
          name: "location"
        - index: 1
          type: "int"
          name: "protocol"

    - subsystem: "net"
      event: "net_dev_xmit"
      args:
        - index: 0
          type: "string"
          name: "dev_name"
        - index: 1
          type: "int"
          name: "skb_len"
        - index: 2
          type: "int"
          name: "queue_mapping"

  # ============================================================
  # Process selector
  # ============================================================
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "kyc-api-gateway"

  spec:
    rateLimit:
      eventsPerSecond: 1000
      burstSize: 200
