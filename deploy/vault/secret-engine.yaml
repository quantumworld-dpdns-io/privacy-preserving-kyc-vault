# Configure KV v2 secrets engine
path "secret/*" {
  capabilities = ["create", "read", "update", "delete", "list"]
}

# Configure Transit secrets engine for encryption-as-a-service
path "transit/*" {
  capabilities = ["create", "read", "update", "delete", "list"]

  # Allowed parameters for transit key operations
  allowed_parameters = {
    "*" = []
  }
}

# Enable engines via Vault API (terraform or CLI equivalent)
# vault secrets enable -path=secret kv-v2
# vault secrets enable -path=transit transit
#
# Create encryption keys:
# vault write -f transit/keys/kyc-encrypt
# vault write -f transit/keys/kyc-sign
# vault write transit/keys/kyc-hmac type=hmac key_size=256
