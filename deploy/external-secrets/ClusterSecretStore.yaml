apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: https://vault.internal:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: kyc-vault-role
          serviceAccountRef:
            name: kyc-vault
      caBundle: ""
      namespace: kyc-vault
      forwardInconsistent: true
