apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kyc-vault-secrets
  namespace: kyc-vault
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kyc-vault-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        DB_PASSWORD: "{{ .db_password }}"
        REDIS_PASSWORD: "{{ .redis_password }}"
        API_KEY: "{{ .api_key }}"
        JWT_SIGNING_KEY: "{{ .jwt_signing_key }}"
        ENCRYPTION_KEY_ID: "{{ .encryption_key_id }}"
  data:
  - secretKey: db_password
    remoteRef:
      key: kyc-service/database
      property: password
  - secretKey: redis_password
    remoteRef:
      key: kyc-service/cache
      property: password
  - secretKey: api_key
    remoteRef:
      key: kyc-service/api
      property: key
  - secretKey: jwt_signing_key
    remoteRef:
      key: kyc-service/jwt
      property: signing_key
  - secretKey: encryption_key_id
    remoteRef:
      key: kyc-service/encryption
      property: key_id
