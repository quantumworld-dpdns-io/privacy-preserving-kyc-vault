apiVersion: 1

providers:
- name: Kubernetes
  orgId: 1
  folder: Kubernetes
  type: file
  disableDeletion: true
  updateIntervalSeconds: 30
  allowUiUpdates: false
  options:
    path: /var/lib/grafana/dashboards/kubernetes

- name: KYC Vault
  orgId: 1
  folder: KYC Vault
  type: file
  disableDeletion: true
  updateIntervalSeconds: 10
  allowUiUpdates: false
  options:
    path: /var/lib/grafana/dashboards/kyc-vault

- name: KYC Vault Mimir
  orgId: 1
  folder: KYC Vault
  type: file
  disableDeletion: true
  updateIntervalSeconds: 10
  allowUiUpdates: false
  options:
    path: /var/lib/grafana/dashboards/kyc-vault

- name: Istio
  orgId: 1
  folder: Service Mesh
  type: file
  disableDeletion: true
  updateIntervalSeconds: 30
  allowUiUpdates: false
  options:
    path: /var/lib/grafana/dashboards/istio

- name: Loki
  orgId: 1
  folder: Logging
  type: file
  disableDeletion: true
  updateIntervalSeconds: 60
  allowUiUpdates: false
  options:
    path: /var/lib/grafana/dashboards/loki
