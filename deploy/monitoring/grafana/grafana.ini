[server]
domain = grafana.example.com
root_url = https://grafana.example.com
http_port = 3000
protocol = https
cert_file = /etc/grafana/tls/tls.crt
cert_key = /etc/grafana/tls/tls.key

[security]
admin_user = admin
admin_password = ${GRAFANA_ADMIN_PASSWORD}
secret_key = ${GRAFANA_SECRET_KEY}
disable_gravatar = true
cookie_secure = true
cookie_samesite = lax

[auth.ldap]
enabled = true
config_file = /etc/grafana/ldap.toml
allow_sign_up = true

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[auth.proxy]
enabled = false

[users]
default_theme = dark
home_page = /dashboards
viewers_can_edit = false
editors_can_admin = false

[server]
enable_gzip = true

[log]
mode = console
level = info

[metrics]
enabled = true
interval_seconds = 10

[analytics]
reporting_enabled = false
check_for_updates = false

[snapshot]
external_enabled = false

[alerting]
enabled = true
execute_alerts = true

[unified_alerting]
enabled = true

[dashboards]
versions_to_keep = 20

[dataproxy]
timeout = 30
