[core]
dags_folder = /opt/airflow/dags
base_log_folder = /opt/airflow/logs
executor = CeleryExecutor
sql_alchemy_conn = postgresql+psycopg2://airflow:${AIRFLOW_DB_PASS}@airflow-db:5432/airflow
load_examples = False
dagbag_import_timeout = 60

[database]
load_default_connections = False
max_db_retries = 3

[webserver]
base_url = http://localhost:8080
web_server_host = 0.0.0.0
web_server_port = 8080
secret_key = ${AIRFLOW_SECRET_KEY}
rbac = True
auth_backend = airflow.providers.fab.auth_manager.api.auth.backend.basic_auth

[celery]
broker_url = redis://:${REDIS_PASS}@airflow-redis:6379/0
result_backend = db+postgresql://airflow:${AIRFLOW_DB_PASS}@airflow-db:5432/airflow
worker_concurrency = 8

[scheduler]
dag_dir_list_interval = 30
min_file_process_interval = 60
parsing_processes = 4
scheduler_heartbeat_interval = 5

[logging]
remote_logging = True
remote_log_conn_id = s3_logs
remote_base_log_folder = s3://kyc-vault-logs/airflow

[kubernetes_executor]
delete_worker_pods = True
multi_namespace_mode = True
