# ============================================================
# Kafka Topic Definitions - KYC Vault Event Bus
# ============================================================
# Managed topics for credential lifecycle, KYC verification,
# webhook delivery, and platform telemetry.

topics:
  # ==========================================================
  # Credential Lifecycle Events
  # ==========================================================
  - name: credential.events
    partitions: 6
    replication_factor: 3
    configs:
      cleanup.policy: delete
      retention.ms: 604800000          # 7 days
      retention.bytes: 1073741824      # 1 GB per partition
      compression.type: zstd
      min.insync.replicas: 2
      max.message.bytes: 1048576       # 1 MB max message size
    value_schema: avro
    value_schema_file: schemas/credential-event.avsc
    description: >
      Core credential lifecycle events including issuance,
      verification, update, revocation, and expiration.
      Used by credential-issuer service, ZKP engine, and audit log.

  - name: credential.verification
    partitions: 6
    replication_factor: 3
    configs:
      cleanup.policy: delete
      retention.ms: 604800000
      compression.type: zstd
      min.insync.replicas: 2
    value_schema: avro
    description: >
      KYC verification events generated by the orchestrator.
      Consumed by AI inference, fraud detection, and compliance services.

  - name: credential.fraud
    partitions: 3
    replication_factor: 3
    configs:
      cleanup.policy: compact,delete
      retention.ms: 2592000000         # 30 days
      compression.type: zstd
      min.insync.replicas: 2
    value_schema: avro
    description: >
      Fraud detection alerts and risk scoring events.
      Compacted by credential ID for latest fraud status.

  - name: credential.audit
    partitions: 3
    replication_factor: 3
    configs:
      cleanup.policy: delete
      retention.ms: 7776000000         # 90 days
      retention.bytes: 10737418240     # 10 GB per partition
      compression.type: zstd
      min.insync.replicas: 2
    value_schema: avro
    description: >
      Immutable audit log entries with cryptographic chaining.
      Long retention for regulatory compliance.

  # ==========================================================
  # KYC Status Changes
  # ==========================================================
  - name: kyc.status.changes
    partitions: 4
    replication_factor: 3
    configs:
      cleanup.policy: compact
      compression.type: zstd
      min.insync.replicas: 2
      max.message.bytes: 524288       # 512 KB
    value_schema: avro
    description: >
      KYC status change notifications (approved, rejected,
      pending_review, tier_upgraded). Compacted by applicant DID
      for latest status.

  - name: kyc.tier.changes
    partitions: 2
    replication_factor: 3
    configs:
      cleanup.policy: compact
      compression.type: zstd
      min.insync.replicas: 2
    description: >
      KYC tier upgrade/downgrade events. Consumed by billing
      and entitlement services.

  # ==========================================================
  # Webhook Delivery
  # ==========================================================
  - name: webhook.delivery
    partitions: 6
    replication_factor: 3
    configs:
      cleanup.policy: delete
      retention.ms: 86400000           # 24 hours
      compression.type: none
      min.insync.replicas: 2
      max.message.bytes: 2097152       # 2 MB
    value_schema: avro
    description: >
      Outbound webhook events for customer integrations.
      Consumed by webhook-relay service with retry logic.
      Short retention since webhooks are delivered quickly.

  - name: webhook.retry
    partitions: 2
    replication_factor: 3
    configs:
      cleanup.policy: delete
      retention.ms: 604800000          # 7 days
      compression.type: zstd
      min.insync.replicas: 2
    description: >
      Dead-letter queue for webhook delivery failures.
      Supports manual retry and monitoring.

  # ==========================================================
  # Platform Telemetry
  # ==========================================================
  - name: telemetry.api
    partitions: 4
    replication_factor: 3
    configs:
      cleanup.policy: delete
      retention.ms: 86400000
      compression.type: zstd
      min.insync.replicas: 2
    description: >
      API request/response telemetry for latency monitoring,
      error tracking, and usage metering.

  - name: telemetry.ai.inference
    partitions: 3
    replication_factor: 3
    configs:
      cleanup.policy: delete
      retention.ms: 604800000
      compression.type: zstd
    description: >
      AI inference latency, model version, and performance metrics.

  # ==========================================================
  # Dead Letter Queue
  # ==========================================================
  - name: _dead_letter_queue
    partitions: 1
    replication_factor: 3
    configs:
      cleanup.policy: delete
      retention.ms: 2592000000
      compression.type: zstd
    description: >
      Global dead letter queue for messages that failed
      processing after all retries.

# ============================================================
# Global Defaults
# ============================================================
default_topic_configs:
  replication.factor: 3
  min.insync.replicas: 2
  cleanup.policy: delete
  compression.type: zstd
  max.message.bytes: 1048576
  message.timestamp.type: CreateTime
  file.delete.delay.ms: 60000
  log.retention.check.interval.ms: 300000
