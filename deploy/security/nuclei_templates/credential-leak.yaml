id: kyc-credential-leak

info:
  name: KYC Credential / PII Exposure
  author: security-team
  severity: critical
  description: |
    Detects exposed KYC credentials, PII data, or authentication tokens
    on endpoints, S3 buckets, configuration files, and API responses.
  classification:
    cve-id: TBD
    cwe-id: CWE-200
  tags: kyc, credential-leak, pii, exposure

requests:
  # ── Well-known credential endpoints ─────────────────────────
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.env.production"
      - "{{BaseURL}}/config.json"
      - "{{BaseURL}}/config.yaml"
      - "{{BaseURL}}/credentials.json"
      - "{{BaseURL}}/credential-examples.json"
      - "{{BaseURL}}/api-keys.json"
      - "{{BaseURL}}/.git/config"
      - "{{BaseURL}}/.aws/credentials"
      - "{{BaseURL}}/vault/token"
      - "{{BaseURL}}/debug/pprof/"
      - "{{BaseURL}}/actuator/env"
      - "{{BaseURL}}/swagger-ui.html"
      - "{{BaseURL}}/api/v1/credentials"
      - "{{BaseURL}}/api/v1/credentials/"
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        words:
          - "aws_access_key_id"
          - "aws_secret_access_key"
          - "credentialType"
          - "issuerDid"
          - "applicantDid"
          - "kyc_passport"
          - "passport_number"
          - "ssn"
          - "social_security"
          - "date_of_birth"
          - "drivers_license"
          - "jwt_secret"
          - "api_key"
          - "apiKey"
          - "x-api-key"
          - "vault_token"
          - "password"
          - "-----BEGIN RSA PRIVATE KEY-----"
          - "-----BEGIN EC PRIVATE KEY-----"
          - "-----BEGIN OPENSSH PRIVATE KEY-----"
        condition: or

  # ── Common debug/info endpoints ──────────────────────────
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/openid-configuration"
      - "{{BaseURL}}/.well-known/jwks.json"
      - "{{BaseURL}}/v1/did/resolve/"
      - "{{BaseURL}}/v1/zkp/prove"
      - "{{BaseURL}}/healthz"
      - "{{BaseURL}}/metrics"
    matchers-condition: or
    matchers:
      - type: word
        words:
          - "did:kyc:"
          - "credentialType"
          - "application/did+json"
          - "credentialStatus"
          - "proofValue"
          - "Ed25519VerificationKey"
          - "X25519KeyAgreement"

  # ── Header-based leaks ──────────────────────────────────
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        words:
          - "x-amz-request-id"
          - "x-amz-id-2"
        part: header
      - type: word
        words:
          - "x-powered-by"
          - "server"
          - "x-aspnet-version"
        part: header
